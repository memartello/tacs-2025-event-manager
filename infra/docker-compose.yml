version: '3.8'

services:
  # Frontend service
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: event-manager-web
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - api
    environment:
      - VITE_API_URL=/api
    networks:
      - event-manager-network

  # Backend API service
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: event-manager-api
    restart: unless-stopped
    expose:
      - "8080"
    environment:
      - PORT=8080
      # Add other environment variables as needed
    networks:
      - event-manager-network
    volumes:
      - ./apps/api:/app
      - go-modules:/go/pkg/mod

  # Reverse Proxy with SSL
  nginx-proxy:
    image: nginx:alpine
    container_name: nginx-proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/nginx/certs:/etc/nginx/certs:ro
      - ./infra/nginx/conf.d:/etc/nginx/conf.d
      - /var/run/docker.sock:/tmp/docker.sock:ro
    depends_on:
      - web
      - api
    networks:
      - event-manager-network

networks:
  event-manager-network:
    driver: bridge

volumes:
  go-modules:
